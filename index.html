<style>
:root{--bg:#0a1628;--panel:#0d1f3a;--accent:#e8a020;--text:#e8e8e8;--border:rgba(255,255,255,0.07);}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;overflow:hidden;}
nav.sidebar{width:320px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0;}
.sidebar-header{padding:20px;border-bottom:1px solid var(--border);text-align:center;font-family:'Bebas Neue',sans-serif;font-size:1.5rem;color:var(--accent);}
.course-header{padding:15px 20px;cursor:pointer;font-family:'Bebas Neue',sans-serif;font-size:1.1rem;color:var(--accent);background:rgba(0,0,0,0.2);border-bottom:1px solid var(--border);}
.course-header:hover{background:rgba(232,160,32,0.1);}
.chapter-list{display:none;background:rgba(0,0,0,0.3);}
.chapter-list.active{display:block;}
.video-item{padding:10px 25px;cursor:pointer;font-size:0.8rem;color:#aaa;border-bottom:1px solid rgba(255,255,255,0.02);}
.video-item:hover{color:#fff;background:#112240;}
.video-item.playing{color:var(--accent);background:#152a4a;font-weight:bold;border-left:3px solid var(--accent);}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{padding:15px 25px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0;}
.topbar-title{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;color:#fff;}
.topbar-counter{font-size:0.7rem;color:#556;margin-top:2px;}
.video-wrapper{flex:1;background:#000;min-height:0;}
#main-player{width:100%;height:100%;background:#000;}
.controls{padding:20px;display:flex;justify-content:center;gap:15px;background:transparent;flex-shrink:0;}
.btn{padding:12px 35px;border-radius:50px;border:none;background:#22334d;color:#fff;cursor:pointer;font-weight:bold;}
.btn:hover{background:var(--accent);}
</style>
</head>
<body>
<button onclick="var s=document.getElementById('sidebar');s.style.display=s.style.display==='none'?'':'none'" style="position:fixed;top:10px;left:10px;z-index:999;background:none;border:none;color:#fff;font-size:1.5rem;cursor:pointer;">☰</button>
<nav class="sidebar" id="sidebar">
<div class="sidebar-header">SERIES VELOCITY</div>
<div id="accordion-menu"></div>
</nav>
<main class="main">
<div id="display-title" class="topbar-title">Selecciona un episodio</div>
<div id="display-counter" class="topbar-counter"></div>
<div class="video-wrapper">
<video id="main-player" controls preload="none"></video>
</div>
<div class="controls">
<button class="btn" id="btn-auto" onclick="toggleAuto()" style="background:#553300;">AUTO OFF</button>
<button class="btn" onclick="changeVideo(-1)">&#8592; Anterior</button>
<button class="btn" onclick="changeVideo(1)">Siguiente &#8594;</button>
</div>

var flatPlaylist=[],currentIndex=0;
function init(){
var menu=document.getElementById('accordion-menu');
courses.forEach(function(course,cIdx){
var chaptersHTML=course.chapters.map(function(ch){
var globalIdx=flatPlaylist.length;
flatPlaylist.push({title:ch.title,url:course.base+ch.file});
return '<div class="video-item" id="item-'+globalIdx+'" onclick="loadVideo('+globalIdx+')">'+ch.title+'</div>';
}).join('');
var section=document.createElement('div');
section.innerHTML='<div class="course-header" onclick="toggleCourse('+cIdx+')">'+course.name+'</div><div class="chapter-list" id="course-'+cIdx+'">'+chaptersHTML+'</div>';
menu.appendChild(section);
});
loadVideo(0);
}
function toggleCourse(idx){
var list=document.getElementById('course-'+idx);
list.classList.toggle('active');
}
function loadVideo(index){
currentIndex=index;
var video=flatPlaylist[currentIndex];
var player=document.getElementById('main-player');
player.src=video.url;
player.load();
player.onended=function(){if(autoPlay){changeVideo(1);setTimeout(function(){document.getElementById('main-player').play().catch(function(){});},500);}};
document.getElementById('display-title').textContent=video.title;
document.getElementById('display-counter').textContent='Episodio '+(currentIndex+1)+' de '+flatPlaylist.length;
document.querySelectorAll('.video-item').forEach(function(el){el.classList.remove('playing');});
var activeItem=document.getElementById('item-'+index);
if(activeItem){activeItem.classList.add('playing');activeItem.scrollIntoView({block:'nearest',behavior:'smooth'});}
}
function changeVideo(dir){
var next=currentIndex+dir;
if(next>=0&&next<flatPlaylist.length)loadVideo(next);
}
var autoPlay=false;
function toggleAuto(){autoPlay=!autoPlay;var btn=document.getElementById('btn-auto');btn.textContent=autoPlay?'AUTO ON':'AUTO OFF';btn.style.background=autoPlay?'#335500':'#553300';}
window.onload=init;
